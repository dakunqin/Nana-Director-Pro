name: Windows preview build
on:
  workflow_dispatch:
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run prepare:tools
      - run: npm test
      - run: npm run dist:win
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
      - uses: actions/upload-artifact@v4
        with:
          name: nana-director-windows-preview
          path: |
            release/*.exe
            release/*.blockmap
            THIRD_PARTY_NOTICES.md
            docs/VALIDATION.md
          retention-days: 14
